# Runs the Go vet and tests on a real Windows host. The Windows compile check already runs on Linux in make verify, but
# path/filepath follows the host OS and Go cannot run Windows tests elsewhere, so path handling such as the danger
# gate's Windows normalization is only tested here. Runs on pushes to ci/** branches and on Run workflow, never on main
# or a tag, so a Windows change is tried on a ci/ branch before it merges.
name: Windows check

on:
  push:
    branches: ['ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go-test
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # Go sources are LF; without this, autocrlf would hand the embedded bibliothek files to the tests with CRLF.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          submodules: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # Test-only portable runtime. Its checksum is from the v7.6.9 release's
      # hashes.sha256 asset and GitHub asset digest; the app never ships pwsh.
      - name: Install pinned PowerShell parser oracle
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'PowerShell-7.6.9-win-x64.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'psparse-pwsh-7.6.9'
          for ($attempt = 1; $attempt -le 4; $attempt++) {
            try {
              Invoke-WebRequest -Uri 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.9/PowerShell-7.6.9-win-x64.zip' -OutFile $archive
              break
            } catch {
              if ($attempt -eq 4) { throw }
              Write-Warning "PowerShell oracle download attempt $attempt failed: $_"
              Start-Sleep -Seconds 5
            }
          }
          $expected = 'ce7484804c0f0ad4dda10c958e71acdaf7eebfb22505c1b480f89e0e9f1da94d'
          if ((Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash -ne $expected) { throw 'PowerShell oracle checksum mismatch' }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $executable = Join-Path $directory 'pwsh.exe'
          "LGRASS_PSPARSE_ORACLE_EXE=$executable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'LGRASS_PSPARSE_ORACLE_REQUIRED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Go vet on windows
        run: go vet ./...

      # vet and test are separate steps, so a failing test never hides a vet failure and the reverse.
      - name: Go tests on windows
        if: ${{ !cancelled() }}
        run: go test ./...

      - name: Windows PowerShell 5.1 parser oracle
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          LGRASS_PSPARSE_ORACLE_51: '1'
          LGRASS_PSPARSE_ORACLE_REQUIRED: '1'
          LGRASS_PSPARSE_ORACLE_REPORT: ${{ runner.temp }}/psparse-windows51.json
        run: go test ./internal/psparse -run '^TestOracleWindows51$' -count=1 -v

      - name: PowerShell 5.1 comparison report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: powershell-51-oracle
          path: ${{ runner.temp }}/psparse-windows51.json
          if-no-files-found: ignore
